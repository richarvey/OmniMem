  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 transparent 0);background-size:44px 44px\">\n\n<!-- ===================== NAV ===================== -->\n<nav data-screen-label=\"Nav\" style=\"position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(11,12,14,0.78);border-bottom:1px solid #1b1e24\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:28px\">\n    <a href=\"#top\" style=\"font-family:'Ubuntu Mono',monospace;font-weight:700;font-size:16px;color:#e7e9ec;letter-spacing:-0.02em;display:flex;align-items:center\">\n      <span style=\"color:#868c96\">&lt;<\u002Fspan><span>OmniMem<\u002Fspan><span style=\"color:#868c96\">&gt;<\u002Fspan>\n    <\u002Fa>\n    <div style=\"flex:1;min-width:0;display:flex;gap:2px;align-items:center;justify-content:center;flex-wrap:wrap\" class=\"omm-navlinks\">\n      <a data-spy=\"problem\" href=\"#problem\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">Why<\u002Fa>\n      <a data-spy=\"in-action\" href=\"#in-action\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">In action<\u002Fa>\n      <a data-spy=\"features\" href=\"#features\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">Features<\u002Fa>\n      <a data-spy=\"lifecycle\" href=\"#lifecycle\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">Lifecycle<\u002Fa>\n      <a data-spy=\"comparison\" href=\"#comparison\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">Compare<\u002Fa>\n      <a data-spy=\"architecture\" href=\"#architecture\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">Architecture<\u002Fa>\n      <a data-spy=\"quickstart\" href=\"#quickstart\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;padding:7px 10px;border-radius:6px;white-space:nowrap\">Get started<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center;flex:none\">\n      <a href=\"https://codeberg.org/ric_harvey/omnimem\" style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#0b0c0e;background:#63bd85;padding:8px 15px;border-radius:7px;font-weight:500;white-space:nowrap\">Source<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ===================== HERO ===================== -->\n<header id=\"top\" data-screen-label=\"Hero\" style=\"max-width:1200px;margin:0 auto;padding:74px 28px 60px;display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center\">\n  <div>\n    <div style=\"display:inline-flex;align-items:center;gap:10px;font-family:'Ubuntu Mono',monospace;font-size:11.5px;color:#969ca5;border:1px solid #262a31;border-radius:100px;padding:6px 13px;margin-bottom:28px\">\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#63bd85;box-shadow:0 0 0 3px rgba(99,189,133,0.18)\"><\u002Fspan>\n      Open source · Self-hosted · Free forever\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:54px;line-height:1.06;letter-spacing:-0.03em;margin:0 0 22px;color:#f2f4f6\">Stop living the same session <span style=\"color:#63bd85;font-style:italic\">twice<\u002Fspan><\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.6;color:#969ca5;margin:0 0 32px;max-width:520px\">A self-hosted MCP server that gives your AI agent persistent memory across sessions, projects, and machines. Everything runs on your hardware — and it's free.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <a href=\"#quickstart\" style=\"font-family:'Ubuntu Mono',monospace;font-size:14px;font-weight:500;color:#0b0c0e;background:#63bd85;padding:13px 22px;border-radius:8px\">Get started →<\u002Fa>\n      <a href=\"https://codeberg.org/ric_harvey/omnimem\" style=\"font-family:'Ubuntu Mono',monospace;font-size:14px;color:#e7e9ec;background:#16191e;border:1px solid #262a31;padding:13px 22px;border-radius:8px\">View source<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- hero terminal -->\n  <div style=\"background:#121418;border:1px solid #262a31;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,0.7)\">\n    <div style=\"display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #1b1e24;background:#0f1114\">\n      <span style=\"width:11px;height:11px;border-radius:50%;background:#3a3d44\"><\u002Fspan>\n      <span style=\"width:11px;height:11px;border-radius:50%;background:#3a3d44\"><\u002Fspan>\n      <span style=\"width:11px;height:11px;border-radius:50%;background:#3a3d44\"><\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11.5px;color:#868c96;margin-left:8px\">claude — recall<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:20px 18px;font-family:'Ubuntu Mono',monospace;font-size:13px;line-height:1.85\">\n      <div style=\"color:#868c96\"><span style=\"color:#63bd85\">$<\u002Fspan> claude<\u002Fdiv>\n      <div style=\"color:#e7e9ec\"><span style=\"color:#63bd85\">claude&gt;<\u002Fspan> recall(<span style=\"color:#d6a44a\">\"markdown editor preferences\"<\u002Fspan>)<\u002Fdiv>\n      <div style=\"height:12px\"><\u002Fdiv>\n      <div style=\"color:#868c96\">→ merged from 4 namespaces, re-ranked<\u002Fdiv>\n      <div style=\"height:8px\"><\u002Fdiv>\n      <div style=\"color:#c9cdd3\"><span style=\"color:#63bd85\">[episodic]<\u002Fspan> you prefer Typora for long-form<\u002Fdiv>\n      <div style=\"color:#c9cdd3\"><span style=\"color:#6f9ceb\">[knowledge]<\u002Fspan> Obsidian 1.6 adds live preview<\u002Fdiv>\n      <div style=\"color:#c9cdd3\"><span style=\"color:#d6a44a\">[project]<\u002Fspan> repo ships docs as .mdx<\u002Fdiv>\n      <div style=\"color:#c9cdd3\"><span style=\"color:#d76a55\">[graveyard]<\u002Fspan> abandoned: remark pipeline (effort 4/5)<\u002Fdiv>\n      <div style=\"height:10px\"><\u002Fdiv>\n      <div><span style=\"color:#63bd85\">claude&gt;<\u002Fspan> <span style=\"display:inline-block;width:8px;height:15px;background:#63bd85;vertical-align:-2px;animation:caret 1.1s step-end infinite\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===================== INSTALL ===================== -->\n<div id=\"install\" data-screen-label=\"Install\" style=\"max-width:1200px;margin:0 auto;padding:0 28px 58px;text-align:center\">\n  <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#63bd85;margin-bottom:14px\">Install OmniMem<\u002Fdiv>\n  <div tabindex=\"0\" aria-label=\"Install command\" style=\"display:inline-flex;align-items:center;gap:12px;max-width:100%;overflow-x:auto;background:#121418;border:1px solid #262a31;border-radius:10px;padding:16px 20px;box-shadow:0 12px 34px -18px rgba(0,0,0,0.7)\">\n    <span aria-hidden=\"true\" style=\"font-family:'Ubuntu Mono',monospace;font-size:14px;color:#63bd85;flex:none\">$<\u002Fspan>\n    <code style=\"font-family:'Ubuntu Mono',monospace;font-size:14px;color:#e7e9ec;white-space:nowrap\">curl -fsSL https://codeberg.org/ric_harvey/omnimem/raw/branch/main/install.sh | bash<\u002Fcode>\n  <\u002Fdiv>\n  <p style=\"font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#868c96;margin:14px 0 0\">Paste that into your terminal &mdash; or follow the <a href=\"#quickstart\">manual setup<\u002Fa> below.<\u002Fp>\n<\u002Fdiv>\n\n<!-- ===================== WORKS WITH RIBBON ===================== -->\n<section data-screen-label=\"Works with\" style=\"border-top:1px solid #1b1e24;background:#0d0e11;padding:38px 0\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;text-align:center\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;min-width:210px;text-align:left\">\n        <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#63bd85\">Model-agnostic<\u002Fspan>\n        <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13.5px;color:#969ca5;line-height:1.5\">Any agent that speaks MCP — <br>one memory layer for all of them.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:1px;align-self:stretch;background:#1b1e24\"><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center;flex:1\">\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/claude-desktop.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>Claude Desktop<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/claude-web.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>Claude Web<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/claude-code.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>Claude Code<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/codex.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>Codex<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/opencode.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>OpenCode<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/kiro.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>Kiro<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/github-copilot.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>GitHub Copilot<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/gitlab-duo.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>GitLab Duo<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/src/branch/main/guides/cursor.md\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#101216;border:1px solid #262a31;border-radius:9px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#c9cdd3;text-decoration:none\" style-hover=\"border-color:#63bd85;color:#f2f4f6\"><span style=\"color:#63bd85\">✓<\u002Fspan>Cursor<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== PROBLEM ===================== -->\n<section id=\"problem\" data-screen-label=\"Problem\" style=\"border-top:1px solid #1b1e24;padding:72px 0\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">01<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">The problem<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start\">\n      <div>\n        <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 20px;color:#f2f4f6\">Every session starts from zero<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0 0 16px\">Your AI agent doesn't know your project. It doesn't remember what failed last week. It has no idea you spent three hours last Tuesday figuring out why <code style=\"font-family:'Ubuntu Mono',monospace;font-size:0.88em;background:#16191e;border:1px solid #262a31;border-radius:4px;padding:1px 6px;color:#d6a44a\">onnxruntime<\u002Fcode> crashes on Alpine, only to find something that actually works.<\u002Fp>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0\">So you explain everything again. It suggests the same broken library again. <strong style=\"color:#e7e9ec;font-weight:600\">Same alarm, same song. It's Groundhog Day — you're Bill Murray, and your agent is Punxsutawney.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <!-- without -->\n        <div style=\"background:#121418;border:1px solid #262a31;border-radius:11px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1b1e24;background:#0f1114\">\n            <span style=\"width:9px;height:9px;border-radius:50%;background:#d76a55\"><\u002Fspan>\n            <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#868c96\">// without omnimem<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;line-height:1.8\">\n            <div><span style=\"color:#63bd85\">claude&gt;<\u002Fspan> <span style=\"color:#c9cdd3\">use onnxruntime for the embeddings<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#868c96;padding:4px 0\">... 45 minutes of debugging later ...<\u002Fdiv>\n            <div style=\"color:#d76a55\">SIGILL: illegal instruction (Alpine musl libc)<\u002Fdiv>\n            <div style=\"height:8px\"><\u002Fdiv>\n            <div style=\"color:#7a808a\">You fixed this exact problem last Tuesday.<\u002Fdiv>\n            <div style=\"color:#7a808a\">Claude doesn't know that.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- with -->\n        <div style=\"background:#121418;border:1px solid rgba(99,189,133,0.35);border-radius:11px;overflow:hidden;box-shadow:0 0 0 1px rgba(99,189,133,0.05)\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1b1e24;background:#0f1411\">\n            <span style=\"width:9px;height:9px;border-radius:50%;background:#63bd85\"><\u002Fspan>\n            <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#63bd85\">// with omnimem<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;line-height:1.8\">\n            <div><span style=\"color:#63bd85\">claude&gt;<\u002Fspan> <span style=\"color:#c9cdd3\">use onnxruntime for the embeddings<\u002Fspan><\u002Fdiv>\n            <div style=\"height:8px\"><\u002Fdiv>\n            <div style=\"color:#d6a44a\">⚠ WARNING: previously abandoned approach<\u002Fdiv>\n            <div style=\"color:#7a808a\">onnxruntime — SIGILL crash on Alpine musl libc <span style=\"color:#d6a44a\">(effort 4/5)<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#63bd85\">→ switched to sentence-transformers instead<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== IN ACTION ===================== -->\n<section id=\"in-action\" data-screen-label=\"In action\" style=\"border-top:1px solid #1b1e24;padding:72px 0;background:#0d0e11\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">02<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">See it in action<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:38px\">\n      <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;color:#f2f4f6\">One <code style=\"font-family:'Ubuntu Mono',monospace;color:#63bd85;font-size:0.82em;background:#16191e;border:1px solid #262a31;border-radius:5px;padding:2px 8px\">recall()<\u002Fcode> pulls context from everywhere<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0\">Personal preferences, ingested articles, past conversations, project context. It's all ranked together and merged into one useful response.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start\">\n      <!-- screenshot placeholder -->\n      <figure style=\"margin:0\">\n        <div style=\"background:#121418;border:1px solid #262a31;border-radius:12px;overflow:hidden;box-shadow:0 18px 44px -22px rgba(0,0,0,0.6)\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1b1e24;background:#0f1114\">\n            <span style=\"width:10px;height:10px;border-radius:50%;background:#3a3d44\"><\u002Fspan>\n            <span style=\"width:10px;height:10px;border-radius:50%;background:#3a3d44\"><\u002Fspan>\n            <span style=\"width:10px;height:10px;border-radius:50%;background:#3a3d44\"><\u002Fspan>\n            <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#868c96;margin-left:6px\">claude — recall<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:18px 18px;font-family:'Ubuntu Mono',monospace;font-size:12px;line-height:1.7\">\n            <!-- prompt -->\n            <div style=\"color:#c9cdd3\"><span style=\"color:#868c96\">›<\u002Fspan> what tools do we know about that are useful for writing markdown in?<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <!-- tool call -->\n            <div style=\"color:#e7e9ec\"><span style=\"color:#63bd85\">●<\u002Fspan> <span style=\"font-weight:500\">omnimem · recall (MCP)<\u002Fspan> <span style=\"color:#868c96\">(query: \"markdown editors and writing tools\", top_k: 10)<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#7a808a;padding-left:16px\">└ {\"result\":[{\"namespace\":<span style=\"color:#6f9ceb\">\"knowledge\"<\u002Fspan>,\"content\":\"Announcing Autosave &amp; More…\",\"score\":<span style=\"color:#63bd85\">0.334<\u002Fspan>,\"state\":<span style=\"color:#63bd85\">\"active\"<\u002Fspan>}, …<\u002Fdiv>\n            <div style=\"color:#868c96;padding-left:16px\">… +70 lines (ctrl+o to expand)<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <!-- answer -->\n            <div style=\"color:#e7e9ec\"><span style=\"color:#868c96\">●<\u002Fspan> From memory, here's what we know about markdown writing tools:<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n\n            <div style=\"color:#e7e9ec;font-weight:500\">You actively use:<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:baseline;padding:2px 0\">\n              <span style=\"flex:1;min-width:0;color:#c9cdd3\">- <span style=\"color:#e7e9ec;font-weight:500\">Vim<\u002Fspan> — your go-to editor for everything, including markdown<\u002Fspan>\n              <span style=\"flex:none;font-size:10px;color:#63bd85;background:rgba(99,189,133,0.10);border:1px solid rgba(99,189,133,0.28);border-radius:5px;padding:2px 7px\">episodic<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:baseline;padding:2px 0\">\n              <span style=\"flex:1;min-width:0;color:#c9cdd3\">- <span style=\"color:#e7e9ec;font-weight:500\">Apostrophe<\u002Fspan> — you wrote a PiSource article about it, a GNOME markdown editor<\u002Fspan>\n              <span style=\"flex:none;font-size:10px;color:#6f9ceb;background:rgba(111,156,235,0.10);border:1px solid rgba(111,156,235,0.28);border-radius:5px;padding:2px 7px\">knowledge<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:10px\"><\u002Fdiv>\n\n            <div style=\"color:#e7e9ec;font-weight:500\">From the self-hosted / FOSS knowledge base:<\u002Fdiv>\n            <div style=\"color:#c9cdd3;padding:1px 0\">- <span style=\"color:#e7e9ec;font-weight:500\">Ghost<\u002Fspan> (MIT, Node.js) — markdown blogging platform you wrote about<\u002Fdiv>\n            <div style=\"color:#c9cdd3;padding:1px 0\">- <span style=\"color:#e7e9ec;font-weight:500\">WriteFreely<\u002Fspan> (AGPL-3.0, Go) — federated markdown blogging<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:baseline;padding:2px 0\">\n              <span style=\"flex:1;min-width:0;color:#c9cdd3\">- <span style=\"color:#e7e9ec;font-weight:500\">BookStack<\u002Fspan> (MIT, PHP) — wiki with markdown support<\u002Fspan>\n              <span style=\"flex:none;font-size:10px;color:#d6a44a;background:rgba(214,164,74,0.10);border:1px solid rgba(214,164,74,0.28);border-radius:5px;padding:2px 7px\">external<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color:#c9cdd3;padding:1px 0\">- <span style=\"color:#e7e9ec;font-weight:500\">Wiki.js<\u002Fspan> (AGPL-3.0, Node.js) — wiki with markdown editor<\u002Fdiv>\n            <div style=\"color:#c9cdd3;padding:1px 0\">- <span style=\"color:#e7e9ec;font-weight:500\">Docmost<\u002Fspan> (AGPL-3.0, Docker) — Confluence alternative<\u002Fdiv>\n            <div style=\"height:10px\"><\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;align-items:baseline\">\n              <span style=\"flex:1;min-width:0;color:#e7e9ec;font-weight:500\">CMS with markdown support:<\u002Fspan>\n              <span style=\"flex:none;font-size:10px;color:#c78ce0;background:rgba(199,140,224,0.10);border:1px solid rgba(199,140,224,0.28);border-radius:5px;padding:2px 7px\">project<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color:#c9cdd3;padding:2px 0\">- <span style=\"color:#e7e9ec;font-weight:500\">Sveltia CMS<\u002Fspan> and <span style=\"color:#e7e9ec;font-weight:500\">DecapCMS<\u002Fspan> — both work with Forgejo/Gitea backends<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n\n            <div style=\"color:#7a808a\">That's the lot — pulled from your conversations, your articles, a repo you trained it on, and your Forgejo preference, all ranked together.<\u002Fdiv>\n            <div style=\"height:12px\"><\u002Fdiv>\n            <div style=\"color:#c9cdd3\"><span style=\"color:#868c96\">›<\u002Fspan> nope that's great — you reminded me of exactly what I use<\u002Fdiv>\n            <div style=\"height:8px\"><\u002Fdiv>\n            <div style=\"color:#e7e9ec\"><span style=\"color:#868c96\">●<\u002Fspan> Glad it worked well. OmniMem connected your preferences and past writing into one useful answer.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font-size:13.5px;line-height:1.6;color:#868c96;margin-top:12px\">A real <code style=\"font-family:'Ubuntu Mono',monospace;font-size:0.92em;color:#969ca5\">recall()<\u002Fcode> about markdown editors. Every tagged line traces back to a different memory source — see the four on the right.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <!-- source annotations -->\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <div style=\"display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #1b1e24\">\n          <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#63bd85;white-space:nowrap;padding-top:2px\">[episodic]<\u002Fspan>\n          <div>\n            <div style=\"font-weight:600;font-size:14.5px;color:#e7e9ec;margin-bottom:3px\">Episodic memory<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;color:#969ca5;margin:0\">Picked up from your conversations — preferences, decisions, and things mentioned in passing.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #1b1e24\">\n          <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#6f9ceb;white-space:nowrap;padding-top:2px\">[knowledge]<\u002Fspan>\n          <div>\n            <div style=\"font-weight:600;font-size:14.5px;color:#e7e9ec;margin-bottom:3px\">Knowledge base<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;color:#969ca5;margin:0\">RSS articles, auto-summarised and embedded. They surface when relevant to what you're asking.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #1b1e24\">\n          <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#d6a44a;white-space:nowrap;padding-top:2px\">[external]<\u002Fspan>\n          <div>\n            <div style=\"font-weight:600;font-size:14.5px;color:#e7e9ec;margin-bottom:3px\">External references<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;color:#969ca5;margin:0\">Links and posts you've shared — GitHub threads, blog posts, anything worth holding onto.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;padding:16px 0\">\n          <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#c78ce0;white-space:nowrap;padding-top:2px\">[project]<\u002Fspan>\n          <div>\n            <div style=\"font-weight:600;font-size:14.5px;color:#e7e9ec;margin-bottom:3px\">Project context<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;color:#969ca5;margin:0\">Extra context it knows matters to you, like your preferred tools and platforms.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FEATURES ===================== -->\n<section id=\"features\" data-screen-label=\"Features\" style=\"border-top:1px solid #1b1e24;padding:72px 0\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">03<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">What makes it different<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:40px\">\n      <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;color:#f2f4f6\">Not just a key-value store with an MCP wrapper<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0\">OmniMem models how memory actually works. Things fade over time, they sometimes contradict each other, and the hard-won stuff earns its place.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#1b1e24;border:1px solid #1b1e24;border-radius:12px;overflow:hidden\">\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#d76a55;margin-bottom:12px\">01 · graveyard<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">The Graveyard<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">Every dead-end gets logged — what you tried, why it failed, how much time you burned. Your agent checks the graveyard before suggesting a library or pattern.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#d6a44a;margin-bottom:12px\">02 · scoring<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Experience scoring<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">Something that took four attempts and a weird platform workaround to crack? That's gold. The harder it was, the more prominently it surfaces next time.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#63bd85;margin-bottom:12px\">03 · integrity<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Contradiction detection<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">If a new memory disagrees with something stored, OmniMem catches it. Fast check on every write, plus optional deep analysis powered by Claude on demand.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#63bd85;margin-bottom:12px\">04 · dedup<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Semantic deduplication<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">New memories get compared against what's there. Too similar? You get a heads-up instead of a duplicate. Run <code style=\"font-family:'Ubuntu Mono',monospace;font-size:0.86em;color:#c9cdd3\">find_duplicates<\u002Fcode> to clean up in bulk.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#6f9ceb;margin-bottom:12px\">05 · namespaces<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Three namespaces<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\"><strong style=\"color:#c9cdd3;font-weight:600\">Episodic<\u002Fstrong> for decisions and bugs. <strong style=\"color:#c9cdd3;font-weight:600\">Project<\u002Fstrong> for stack and state. <strong style=\"color:#c9cdd3;font-weight:600\">Knowledge<\u002Fstrong> for RSS articles. All searched together.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#6f9ceb;margin-bottom:12px\">06 · briefing<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">One-call briefing<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">One <code style=\"font-family:'Ubuntu Mono',monospace;font-size:0.86em;color:#c9cdd3\">briefing()<\u002Fcode> and your agent gets project context, experience stats, stale memories, new articles, and contradictions. No three-step warm-up.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#c78ce0;margin-bottom:12px\">07 · dashboard<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Web UI dashboard<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">Browse, search, and manage memories from an htmx interface. RSS feeds, project contexts, backups, memory details — all without the command line.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#c78ce0;margin-bottom:12px\">08 · telemetry<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Telemetry &amp; metrics<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">Every recall tracks which memories get used. Recall counts and last-accessed per memory, plus a Prometheus <code style=\"font-family:'Ubuntu Mono',monospace;font-size:0.86em;color:#c9cdd3\">/metrics<\u002Fcode> endpoint for Grafana.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#101216;padding:26px 24px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#d6a44a;margin-bottom:12px\">09 · maintenance<\u002Fdiv>\n        <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:17px;font-weight:500;margin:0 0 10px;color:#f2f4f6\">Auto-maintenance<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.65;color:#969ca5;margin:0\">Every few briefings, OmniMem scans for duplicates and runs a heuristic contradiction check. Stale duplicates archived, conflicts flagged — in the background.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== LIFECYCLE ===================== -->\n<section id=\"lifecycle\" data-screen-label=\"Lifecycle\" style=\"border-top:1px solid #1b1e24;padding:72px 0;background:#0d0e11\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">04<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">Lifecycle<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:40px\">\n      <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;color:#f2f4f6\">Memory is not binary<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0\">Most systems either remember or delete. OmniMem has a proper lifecycle. When you say \"forget about X\" you usually mean <em style=\"color:#c9cdd3;font-style:italic\">stop bringing it up<\u002Fem>, not wipe it from existence.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- lifecycle states -->\n    <div style=\"display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-bottom:40px\">\n      <div style=\"flex:1;min-width:150px;background:#101216;border:1px solid #262a31;border-radius:10px;padding:20px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.1em;color:#63bd85;margin-bottom:8px\">ACTIVE<\u002Fdiv>\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:22px;font-weight:700;color:#f2f4f6\">1.0<span style=\"font-size:13px;color:#868c96;font-weight:400\">× weight<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;padding:0 8px;font-family:'Ubuntu Mono',monospace;color:#646b76;font-size:18px\">→<\u002Fdiv>\n      <div style=\"flex:1;min-width:150px;background:#101216;border:1px solid #262a31;border-radius:10px;padding:20px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.1em;color:#d6a44a;margin-bottom:8px\">DEPRIORITISED<\u002Fdiv>\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:22px;font-weight:700;color:#f2f4f6\">0.2<span style=\"font-size:13px;color:#868c96;font-weight:400\">× weight<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;padding:0 8px;font-family:'Ubuntu Mono',monospace;color:#646b76;font-size:18px\">→<\u002Fdiv>\n      <div style=\"flex:1;min-width:150px;background:#101216;border:1px solid #262a31;border-radius:10px;padding:20px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.1em;color:#d76a55;margin-bottom:8px\">ARCHIVED<\u002Fdiv>\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:22px;font-weight:700;color:#f2f4f6\">0.0<span style=\"font-size:13px;color:#868c96;font-weight:400\">× weight<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;padding:0 8px;font-family:'Ubuntu Mono',monospace;color:#646b76;font-size:18px\">→<\u002Fdiv>\n      <div style=\"flex:1;min-width:150px;background:#101216;border:1px solid #262a31;border-radius:10px;padding:20px\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.1em;color:#868c96;margin-bottom:8px\">DELETED<\u002Fdiv>\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:22px;font-weight:700;color:#868c96\">gone<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start\">\n      <div>\n        <p style=\"font-size:15px;line-height:1.7;color:#969ca5;margin:0 0 24px\">Deprioritised memories aren't gone for good. Attach <strong style=\"color:#c9cdd3;font-weight:600\">reinstate hints<\u002Fstrong>, and if a future query matches, the memory comes back with a note explaining why it was pushed down. You can mute entire topics across all sessions.<\u002Fp>\n        <div style=\"background:#0b0c0e;border:1px solid #262a31;border-radius:10px;padding:18px 20px\">\n          <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#868c96;margin-bottom:10px\">// final ranking<\u002Fdiv>\n          <div style=\"font-family:'Ubuntu Mono',monospace;font-size:14.5px;line-height:1.6;color:#e7e9ec\">score = <span style=\"color:#63bd85\">similarity<\u002Fspan> × <span style=\"color:#d6a44a\">surface_score<\u002Fspan> × <span style=\"color:#6f9ceb\">recency<\u002Fspan> × <span style=\"color:#c78ce0\">experience_weight<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.6;color:#7a808a;margin:14px 0 0\">Four factors decide what comes back. Semantic similarity alone isn't enough — lifecycle state, age, and how hard it was to figure out all play a role.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- effort table -->\n      <div style=\"background:#101216;border:1px solid #262a31;border-radius:10px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:56px 1fr 76px;padding:12px 18px;border-bottom:1px solid #1b1e24;font-family:'Ubuntu Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#868c96\">\n          <div>Effort<\u002Fdiv><div>Meaning<\u002Fdiv><div style=\"text-align:right\">Weight<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr 76px;padding:13px 18px;border-bottom:1px solid #16181d;font-family:'Ubuntu Mono',monospace;font-size:13.5px;align-items:center\"><div style=\"color:#868c96\">1<\u002Fdiv><div style=\"color:#c9cdd3\">Worked first time<\u002Fdiv><div style=\"text-align:right;color:#7a808a\">1.0×<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr 76px;padding:13px 18px;border-bottom:1px solid #16181d;font-family:'Ubuntu Mono',monospace;font-size:13.5px;align-items:center\"><div style=\"color:#868c96\">2<\u002Fdiv><div style=\"color:#c9cdd3\">Minor friction<\u002Fdiv><div style=\"text-align:right;color:#7a808a\">1.1×<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr 76px;padding:13px 18px;border-bottom:1px solid #16181d;font-family:'Ubuntu Mono',monospace;font-size:13.5px;align-items:center\"><div style=\"color:#868c96\">3<\u002Fdiv><div style=\"color:#c9cdd3\">Multiple iterations<\u002Fdiv><div style=\"text-align:right;color:#c9cdd3\">1.25×<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr 76px;padding:13px 18px;border-bottom:1px solid #16181d;font-family:'Ubuntu Mono',monospace;font-size:13.5px;align-items:center\"><div style=\"color:#d6a44a\">4<\u002Fdiv><div style=\"color:#e7e9ec\">Significant struggle<\u002Fdiv><div style=\"text-align:right;color:#d6a44a\">1.5×<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr 76px;padding:13px 18px;font-family:'Ubuntu Mono',monospace;font-size:13.5px;align-items:center;background:rgba(99,189,133,0.05)\"><div style=\"color:#63bd85\">5<\u002Fdiv><div style=\"color:#f2f4f6\">Battle-hardened<\u002Fdiv><div style=\"text-align:right;color:#63bd85;font-weight:500\">1.8×<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPARISON ===================== -->\n<section id=\"comparison\" data-screen-label=\"Comparison\" style=\"border-top:1px solid #1b1e24;padding:72px 0\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">05<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">How it compares<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;color:#f2f4f6\">Most memory servers just store and retrieve<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0\">Claude Code's built-in memory — CLAUDE.md plus the newer auto-memory that writes markdown notes for itself — is still flat, machine-local files with keyword recall: no semantic search, no lifecycle, no contradiction handling. OmniMem goes quite a bit further.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #1b1e24;border-radius:12px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;background:#0f1114;border-bottom:1px solid #1b1e24\">\n        <div style=\"padding:15px 20px;font-family:'Ubuntu Mono',monospace;font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:#868c96\">Capability<\u002Fdiv>\n        <div style=\"padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:11.5px;text-transform:uppercase;color:#868c96;text-align:center\">Claude built-in<\u002Fdiv>\n        <div style=\"padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:11.5px;text-transform:uppercase;color:#868c96;text-align:center\">Typical MCP<\u002Fdiv>\n        <div style=\"padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:11.5px;text-transform:uppercase;color:#63bd85;text-align:center;background:rgba(99,189,133,0.06)\">&lt;OmniMem&gt;<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"omm-cmp\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ARCHITECTURE ===================== -->\n<section id=\"architecture\" data-screen-label=\"Architecture\" style=\"border-top:1px solid #1b1e24;padding:72px 0;background:#0d0e11\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">06<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">Architecture<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:40px\">\n      <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;color:#f2f4f6\">Four containers. Nothing leaves your machine.<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#969ca5;margin:0\">Local embeddings, self-hosted, Docker. Both the MCP server and web UI connect directly to Valkey and share the memory package.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.15fr 0.85fr;gap:28px;align-items:start\">\n      <!-- diagram -->\n      <div data-om-raster=\"true\" style=\"background:#101216;border:1px solid #262a31;border-radius:12px;padding:26px 24px\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px\">\n          <div style=\"border:1px solid #262a31;border-radius:8px;padding:13px 15px;text-align:center\">\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#e7e9ec\">AI agent<\u002Fdiv>\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#868c96;margin-top:3px\">any machine · SSE/MCP<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #262a31;border-radius:8px;padding:13px 15px;text-align:center\">\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#e7e9ec\">Browser<\u002Fdiv>\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#868c96;margin-top:3px\">HTTP :8080<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;color:#646b76;font-family:'Ubuntu Mono',monospace;font-size:14px;line-height:1\">↓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;↓<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0\">\n          <div style=\"border:1px solid rgba(99,189,133,0.4);border-radius:8px;padding:15px;background:rgba(99,189,133,0.04)\">\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85;margin-bottom:6px\">MCP Server<\u002Fdiv>\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#7a808a;line-height:1.7\">Python fastmcp<br>remember · recall · deprioritise<br>record_experience · briefing · health<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #262a31;border-radius:8px;padding:15px\">\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#e7e9ec;margin-bottom:6px\">Web UI<\u002Fdiv>\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#7a808a;line-height:1.7\">Starlette · htmx · Jinja2<br>Dashboard · Search · Browse<br>Projects · Duplicates · Backups<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;color:#646b76;font-family:'Ubuntu Mono',monospace;font-size:14px;line-height:1\">↓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;↓<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px\">\n          <div style=\"border:1px solid #262a31;border-radius:8px;padding:15px\">\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#e7e9ec;margin-bottom:6px\">Valkey + search<\u002Fdiv>\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#7a808a;line-height:1.7\">idx:episodic<br>idx:project<br>idx:knowledge<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #262a31;border-radius:8px;padding:15px\">\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#e7e9ec;margin-bottom:6px\">RSS Worker<\u002Fdiv>\n            <div style=\"font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#7a808a;line-height:1.7\">feedparser<br>APScheduler<br>Claude Haiku<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- recall pipeline -->\n      <div style=\"background:#0b0c0e;border:1px solid #262a31;border-radius:12px;overflow:hidden\">\n        <div style=\"padding:14px 18px;border-bottom:1px solid #1b1e24;font-family:'Ubuntu Mono',monospace;font-size:11.5px;color:#868c96\">// recall pipeline<\u002Fdiv>\n        <div style=\"padding:8px 0\">\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> query<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> abandoned fast-path (keyword scan)<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> embed query<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> vector search, top 20 / namespace<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> filter archived + deleted<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> filter suppressed topics<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> apply surface_score<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> apply recency decay (90d)<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> apply experience_weight<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> check reinstate eligibility<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#969ca5;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> surface contradiction warnings<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#e7e9ec;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> merge, re-rank, return top_k<\u002Fdiv>\n          <div style=\"padding:6px 18px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:#868c96;line-height:1.5\"><span style=\"color:#63bd85\">→<\u002Fspan> log event + increment counters<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== QUICKSTART ===================== -->\n<section id=\"quickstart\" data-screen-label=\"Quickstart\" style=\"border-top:1px solid #1b1e24;padding:72px 0\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:20px\">\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#63bd85\">07<\u002Fspan>\n      <span style=\"font-family:'Ubuntu Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#868c96\">Get started<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:40px\">\n      <h2 style=\"font-family:'Ubuntu',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;color:#f2f4f6\">Up and running in two minutes<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <!-- step 1 -->\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:26px;font-weight:700;color:#646b76;line-height:1;padding-top:4px\">01<\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:18px;font-weight:500;margin:0 0 8px;color:#f2f4f6\">Clone and configure<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:#969ca5;margin:0 0 14px;max-width:640px\">Pick a strong Valkey password. For RSS summaries and smarter contradiction detection, add your Anthropic API key too.<\u002Fp>\n          <div style=\"background:#0f1114;border:1px solid #262a31;border-radius:9px;overflow:hidden;max-width:720px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #1b1e24\">\n              <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#868c96\">bash<\u002Fspan>\n              <button type=\"button\" data-copy=\"\" style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#969ca5;background:transparent;border:1px solid #262a31;border-radius:5px;padding:3px 9px;cursor:pointer\">copy<\u002Fbutton>\n            <\u002Fdiv>\n            <pre style=\"margin:0;padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;line-height:1.75;color:#c9cdd3;overflow-x:auto\"><span style=\"color:#868c96\"># clone the repo<\u002Fspan>\ngit clone https://codeberg.org/ric_harvey/omnimem.git\ncd omnimem\ncp .env.example .env\n<span style=\"color:#868c96\"># edit .env: set VALKEY_PASSWORD and ANTHROPIC_API_KEY<\u002Fspan><\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- step 2 -->\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:26px;font-weight:700;color:#646b76;line-height:1;padding-top:4px\">02<\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:18px;font-weight:500;margin:0 0 8px;color:#f2f4f6\">Start the containers<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:#969ca5;margin:0 0 14px;max-width:640px\">Spins up four containers: Valkey with vector search, the MCP server, the RSS worker, and the web UI dashboard.<\u002Fp>\n          <div style=\"background:#0f1114;border:1px solid #262a31;border-radius:9px;overflow:hidden;max-width:720px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #1b1e24\">\n              <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#868c96\">bash<\u002Fspan>\n              <button type=\"button\" data-copy=\"\" style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#969ca5;background:transparent;border:1px solid #262a31;border-radius:5px;padding:3px 9px;cursor:pointer\">copy<\u002Fbutton>\n            <\u002Fdiv>\n            <pre style=\"margin:0;padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;line-height:1.75;color:#c9cdd3;overflow-x:auto\">docker compose up -d\n<span style=\"color:#868c96\"># Web UI at http://localhost:8080<\u002Fspan><\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- step 3 -->\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start\">\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:26px;font-weight:700;color:#646b76;line-height:1;padding-top:4px\">03<\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:'Ubuntu',sans-serif;font-size:18px;font-weight:500;margin:0 0 8px;color:#f2f4f6\">Connect Claude Code<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:#969ca5;margin:0 0 14px;max-width:640px\">Point Claude Code at OmniMem in your MCP config, then drop the included CLAUDE.md into your project.<\u002Fp>\n          <div style=\"background:#0f1114;border:1px solid #262a31;border-radius:9px;overflow:hidden;max-width:720px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #1b1e24\">\n              <span style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#868c96\">~/.claude.json or .mcp.json<\u002Fspan>\n              <button type=\"button\" data-copy=\"\" style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;color:#969ca5;background:transparent;border:1px solid #262a31;border-radius:5px;padding:3px 9px;cursor:pointer\">copy<\u002Fbutton>\n            <\u002Fdiv>\n            <pre style=\"margin:0;padding:15px 16px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;line-height:1.75;color:#c9cdd3;overflow-x:auto\">{\n  <span style=\"color:#6f9ceb\">\"mcpServers\"<\u002Fspan>: {\n    <span style=\"color:#6f9ceb\">\"omnimem\"<\u002Fspan>: {\n      <span style=\"color:#6f9ceb\">\"type\"<\u002Fspan>: <span style=\"color:#63bd85\">\"sse\"<\u002Fspan>,\n      <span style=\"color:#6f9ceb\">\"url\"<\u002Fspan>: <span style=\"color:#63bd85\">\"http://localhost:8765/sse\"<\u002Fspan>\n    }\n  }\n}<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- pro tip + cta -->\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-top:40px;background:#101216;border:1px solid #262a31;border-radius:12px;padding:24px 28px\">\n      <div>\n        <div style=\"font-family:'Ubuntu Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#63bd85;margin-bottom:8px\">Pro tip<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.65;color:#969ca5;margin:0;max-width:640px\">OmniMem's instructions are injected automatically when the MCP server connects. To customise how Claude uses OmniMem across all projects, add your own overrides to <code style=\"font-family:'Ubuntu Mono',monospace;font-size:0.88em;color:#c9cdd3\">~/.claude/CLAUDE.md<\u002Fcode>.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"https://codeberg.org/ric_harvey/omnimem\" style=\"font-family:'Ubuntu Mono',monospace;font-size:13.5px;font-weight:500;color:#0b0c0e;background:#63bd85;padding:12px 20px;border-radius:8px;white-space:nowrap\">View on Codeberg →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FOOTER ===================== -->\n<footer data-screen-label=\"Footer\" style=\"border-top:1px solid #1b1e24;padding:44px 0 60px\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 28px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:28px\">\n    <div>\n      <div style=\"font-family:'Ubuntu Mono',monospace;font-weight:700;font-size:15px;color:#e7e9ec;margin-bottom:10px\"><span style=\"color:#868c96\">&lt;<\u002Fspan>OmniMem<span style=\"color:#868c96\">&gt;<\u002Fspan><\u002Fdiv>\n      <p style=\"font-size:13.5px;line-height:1.6;color:#868c96;margin:0;max-width:360px\">MIT Licensed. Built by <a href=\"https://squarecows.com\">Ric Harvey @ SquareCows<\u002Fa> — an AI and automation consultancy for people who'd rather own their tools.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:40px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <a href=\"https://codeberg.org/ric_harvey/omnimem\" style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#969ca5\">Source<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/issues\" style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#969ca5\">Issues<\u002Fa>\n        <a href=\"https://codeberg.org/ric_harvey/omnimem/releases\" style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#969ca5\">Releases<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <a href=\"https://squarecows.com\" style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#969ca5\">SquareCows Ltd<\u002Fa>\n        <a href=\"https://mastodon.squarecows.com/@Ric\" style=\"font-family:'Ubuntu Mono',monospace;font-size:13px;color:#969ca5\">@Ric on Mastodon<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // ---- build comparison rows ----\n    const rows = [\n      [\"Semantic vector search\", \"No\", \"Yes\", \"Yes\"],\n      [\"Memory lifecycle states\", \"No\", \"No\", \"Yes, 4 states\"],\n      [\"Abandoned approach warnings\", \"No\", \"No\", \"Yes, graveyard\"],\n      [\"Experience scoring\", \"No\", \"No\", \"Yes, effort 1-5\"],\n      [\"Contradiction detection\", \"No\", \"No\", \"Yes, 2-tier\"],\n      [\"Semantic deduplication\", \"No\", \"Partial\", \"Yes, write + batch\"],\n      [\"Topic suppression\", \"No\", \"No\", \"Yes\"],\n      [\"RSS knowledge ingestion\", \"No\", \"No\", \"Yes, auto-summarised\"],\n      [\"Reinstate hints\", \"No\", \"No\", \"Yes\"],\n      [\"Self-hosted / no SaaS\", \"Local files\", \"Varies\", \"Yes, Docker\"],\n      [\"Multi-machine sync\", \"No\", \"Varies\", \"Yes, via proxy\"],\n      [\"Web dashboard\", \"No\", \"No\", \"Yes, htmx\"],\n      [\"Telemetry / Prometheus\", \"No\", \"No\", \"Yes, /metrics\"],\n      [\"Auto-maintenance\", \"No\", \"No\", \"Yes, on briefing\"],\n    ];\n    const host = this.el ? this.el.querySelector('.omm-cmp') : document.querySelector('.omm-cmp');\n    const container = document.querySelector('.omm-cmp');\n    if (container) {\n      const cell = (txt, opts = {}) => {\n        const c = document.createElement('div');\n        c.style.cssText = \"padding:13px 16px;font-family:'Ubuntu Mono',monospace;font-size:12.5px;line-height:1.4;\" + (opts.css || \"\");\n        if (txt === \"No\") { c.textContent = \"—\"; c.style.color = \"#646b76\"; c.style.textAlign = \"center\"; }\n        else if (txt === \"Yes\") { c.textContent = \"✓\"; c.style.color = \"#63bd85\"; c.style.textAlign = \"center\"; }\n        else if (opts.omni) { c.textContent = txt; c.style.color = \"#63bd85\"; c.style.textAlign = \"center\"; c.style.background = \"rgba(99,189,133,0.06)\"; }\n        else if (opts.head) { c.textContent = txt; c.style.color = \"#e7e9ec\"; }\n        else { c.textContent = txt; c.style.color = \"#7a808a\"; c.style.textAlign = \"center\"; }\n        return c;\n      };\n      rows.forEach((r, i) => {\n        const rowEl = document.createElement('div');\n        rowEl.style.cssText = \"display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;\" + (i < rows.length - 1 ? \"border-bottom:1px solid #16181d;\" : \"\");\n        rowEl.appendChild(cell(r[0], { head: true, css: \"text-align:left\" }));\n        rowEl.appendChild(cell(r[1]));\n        rowEl.appendChild(cell(r[2]));\n        rowEl.appendChild(cell(r[3], { omni: true }));\n        container.appendChild(rowEl);\n      });\n    }\n\n    // ---- copy buttons ----\n    document.querySelectorAll('[data-copy]').forEach((btn) => {\n      btn.addEventListener('click', () => {\n        const pre = btn.closest('div').parentElement.querySelector('pre');\n        if (!pre) return;\n        navigator.clipboard && navigator.clipboard.writeText(pre.innerText);\n        const orig = btn.textContent;\n        btn.textContent = 'copied ✓';\n        btn.style.color = '#63bd85';\n        setTimeout(() => { btn.textContent = orig; btn.style.color = '#969ca5'; }, 1400);\n      });\n    });\n\n    // ---- scrollspy ----\n    const links = [...document.querySelectorAll('[data-spy]')];\n    const setActive = (id) => {\n      links.forEach((l) => {\n        const on = l.getAttribute('data-spy') === id;\n        l.style.color = on ? '#e7e9ec' : '#969ca5';\n        l.style.background = on ? '#16191e' : 'transparent';\n      });\n    };\n    const secs = ['problem','in-action','features','lifecycle','comparison','architecture','quickstart'].map((id) => document.getElementById(id)).filter(Boolean);\n    if ('IntersectionObserver' in window && secs.length) {\n      const obs = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });\n      }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });\n      secs.forEach((s) => obs.observe(s));\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
