[package]
name = "omnimem"
description = "Self-hosted semantic memory for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
omnimem-app.workspace = true
omnimem-core.workspace = true
omnimem-desktop = { workspace = true, optional = true }
omnimem-embed.workspace = true
omnimem-engine.workspace = true
omnimem-llm.workspace = true
omnimem-mcp.workspace = true
omnimem-rss.workspace = true
omnimem-store.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# The tray or menu bar app and its settings window. Needs GTK and WebKitGTK
# to build on Linux; installers enable it, the headless builds leave it off.
desktop = ["dep:omnimem-desktop"]
