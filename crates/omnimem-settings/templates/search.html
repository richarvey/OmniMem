{% extends "base.html" %}

{% block title %}Search — OmniMem{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>Search</h1>
    <p class="page-intro">Search by meaning, as an agent's recall does, across every namespace or one.</p>
  </div>
</header>

<form class="filter-bar" method="GET" action="{{ admin }}/search" role="search">
  <div class="form-group" style="flex:1;min-width:250px">
    <label for="search-query">Query</label>
    <input type="text" id="search-query" name="query" class="form-input" placeholder="Describe what you're looking for..."
           value="{{ query }}" autofocus>
  </div>
  <div class="form-group">
    <label for="search-namespace">Namespace</label>
    <select class="form-select" id="search-namespace" name="namespace">
      <option value="">All</option>
      <option value="episodic"{% if namespace == 'episodic' %} selected{% endif %}>Episodic</option>
      <option value="project"{% if namespace == 'project' %} selected{% endif %}>Project</option>
      <option value="preference"{% if namespace == 'preference' %} selected{% endif %}>Preference</option>
      <option value="knowledge"{% if namespace == 'knowledge' %} selected{% endif %}>Knowledge</option>
    </select>
  </div>
  <div class="form-group">
    <label for="search-project">Project</label>
    <input type="text" id="search-project" name="project" class="form-input" placeholder="Filter by project"
           value="{{ project }}" style="width:150px">
  </div>
  <div class="form-group">
    <label for="search-valid-at" title="Only what was true on this day">True on</label>
    <input type="date" id="search-valid-at" name="valid_at" class="form-input" value="{{ valid_at }}">
  </div>
  <div class="form-group">
    <label for="search-known-at" title="Only what OmniMem believed on this day">Known on</label>
    <input type="date" id="search-known-at" name="known_at" class="form-input" value="{{ known_at }}">
  </div>
  <div class="form-group">
    <label for="search-top-k">Max results</label>
    <input type="number" id="search-top-k" name="top_k" class="form-input" value="{{ top_k }}" min="1" max="50" style="width:80px">
  </div>
  <div class="form-group" style="align-self:end">
    <button type="submit" class="btn btn-primary">
      Search
      <span class="htmx-indicator spinner" id="search-spinner"></span>
    </button>
  </div>
</form>

<div id="search-results"{% if query %} hx-get="{{ admin }}/search/results?query={{ query|urlquote }}&amp;namespace={{ namespace|urlquote }}&amp;project={{ project|urlquote }}&amp;top_k={{ top_k }}" hx-trigger="load" hx-indicator="#search-spinner"{% endif %}>
  {% if results is not none %}
    {% include "search_results.html" %}
  {% endif %}
</div>
{% endblock %}
