{% if effortful %}
<div class="table-scroll" tabindex="0">
<table class="data-table effortful-table">
  <thead>
    <tr>
      <th>Effort</th>
      <th>Outcome</th>
      <th>Content</th>
    </tr>
  </thead>
  <tbody>
    {% for m in effortful %}
    <tr>
      <td><span class="score">{{ m.effort_score }}/5</span></td>
      <td><span class="badge {{ 'active' if m.outcome == 'succeeded' else 'deprioritised' if m.outcome == 'pivoted' else 'abandoned' }}">{{ m.outcome }}</span></td>
      <td class="content-cell"><a href="{{ admin }}/memory/{{ m.key|urlsegment }}?back={{ here|urlquote }}">{{ m.content|plain }}</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% include "partials/pagination.html" %}
{% else %}
<p class="empty-state">No {{ outcome_filter or "experience" }} memories recorded yet.</p>
{% endif %}
