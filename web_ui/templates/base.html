<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OmniMem{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">OmniMem</h1>
        <span class="version-badge">v3</span>
      </div>
      <ul class="nav-list">
        <li><a href="/" class="nav-link{% if current_page == 'dashboard' %} active{% endif %}">Dashboard</a></li>
        <li><a href="/memories" class="nav-link{% if current_page == 'memories' %} active{% endif %}">Memories</a></li>
        <li><a href="/search" class="nav-link{% if current_page == 'search' %} active{% endif %}">Search</a></li>
        <li><a href="/create" class="nav-link{% if current_page == 'create' %} active{% endif %}">Create</a></li>
        <li class="nav-divider"></li>
        <li><a href="/projects" class="nav-link{% if current_page == 'projects' %} active{% endif %}">Projects</a></li>
        <li><a href="/experience" class="nav-link{% if current_page == 'experience' %} active{% endif %}">Experience</a></li>
        <li><a href="/duplicates" class="nav-link{% if current_page == 'duplicates' %} active{% endif %}">Duplicates</a></li>
        <li><a href="/contradictions" class="nav-link{% if current_page == 'contradictions' %} active{% endif %}">Contradictions</a></li>
        <li><a href="/suppressions" class="nav-link{% if current_page == 'suppressions' %} active{% endif %}">Suppressions</a></li>
        <li><a href="/backups" class="nav-link{% if current_page == 'backups' %} active{% endif %}">Backups</a></li>
      </ul>
    </nav>
    <main class="content">
      <div id="flash-area">
        {% block flash %}{% endblock %}
      </div>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
