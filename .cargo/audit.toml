# cargo audit's settings, for scripts/security-check.sh and CI's security
# scans. Every ignored advisory says why it can't reach OmniMem and when the
# ignore goes.

[advisories]
ignore = [
    # glib 0.18's VariantStrIter passes an out-argument as &p rather than
    # &mut p, so an optimised build can read a null pointer (fixed in glib
    # 0.20). glib 0.18 comes in through gtk 0.18, which tao and tray-icon
    # still require, so 0.20 can't be reached. VariantStrIter is only built
    # by Variant::array_iter_str(), which nothing in the tree calls: neither
    # of those crates, and the desktop's one D-Bus call reads its reply as a
    # (bool,). Remove this when tao and tray-icon move past gtk 0.18.
    "RUSTSEC-2024-0429",
]
