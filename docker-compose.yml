services:
  valkey:
    image: valkey/valkey:8-alpine
    command: >
      valkey-server
      --loadmodule /usr/lib/valkey/valkey-search.so
      --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp_server:
    build: ./mcp_server
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    volumes:
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      - MCP_HOST=0.0.0.0
    restart: unless-stopped

  rss_worker:
    build: ./rss_worker
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./rss_worker/feeds.yml:/app/feeds.yml:ro
    env_file:
      - .env
    restart: unless-stopped

volumes:
  valkey_data:
