services:
  valkey:
    image: valkey/valkey-extension:latest
    command: >
      valkey-server
      --loadmodule /usr/lib/valkey/libsearch.so
      --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env}
      --notify-keyspace-events AKE
      --appendonly yes
      --appendfsync everysec
    volumes:
      - valkey_data:/data
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp_server:
    build: ./mcp_server
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    volumes:
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      - MCP_HOST=0.0.0.0
    restart: unless-stopped

  rss_worker:
    build: ./rss_worker
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./rss_worker/feeds.yml:/app/feeds.yml
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    restart: unless-stopped

  web_ui:
    build:
      context: .
      dockerfile: web_ui/Dockerfile
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./backups:/app/backups
      - ./rss_worker/feeds.yml:/app/feeds.yml
    env_file:
      - .env
    restart: unless-stopped

volumes:
  valkey_data:
