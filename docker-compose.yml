services:
  valkey:
    image: valkey/valkey-extension:latest
    command: >
      valkey-server
      --loadmodule /usr/lib/valkey/libsearch.so
      --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env}
      --notify-keyspace-events AKE
      --appendonly yes
      --appendfsync everysec
    volumes:
      - valkey_data:/data
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp_server:
    build: ./mcp_server
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    volumes:
      - ./backups:/app/backups
      - hf_cache:/app/hf-cache
    env_file:
      - .env
    environment:
      - MCP_HOST=0.0.0.0
    restart: unless-stopped

  rss_worker:
    build:
      context: .
      dockerfile: rss_worker/Dockerfile
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./rss_worker/feeds.yml:/app/feeds.yml
      - hf_cache:/app/hf-cache
    env_file:
      - .env
    environment:
      # Keep the worker's embedding threads down: it runs beside the MCP
      # server and its throughput is bounded by feed fetches, not the CPU.
      # EMBEDDING_THREADS is the ONNX Runtime knob; OMP_NUM_THREADS only
      # matters for the optional torch backend.
      - EMBEDDING_THREADS=1
      - OMP_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    restart: unless-stopped

  web_ui:
    build:
      context: .
      dockerfile: web_ui/Dockerfile
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./backups:/app/backups
      - hf_cache:/app/hf-cache
      - ./rss_worker/feeds.yml:/app/feeds.yml
    env_file:
      - .env
    restart: unless-stopped

volumes:
  valkey_data:
  # The embedding model's files (~90 MB), shared by all three services so a
  # recreated container starts from cache instead of huggingface.co. All
  # three images run as the first non-root user (uid 1000), so one volume
  # serves them all.
  hf_cache:
