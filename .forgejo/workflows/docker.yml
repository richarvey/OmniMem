name: Docker Build & Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mcp-server:
    name: Build mcp_server
    runs-on: sqcows
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: /usr/bin/docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Docker Buildx
        run: |
          /usr/bin/docker buildx create --name multiarch --driver docker-container --use || true
          /usr/bin/docker buildx inspect --bootstrap

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            /usr/bin/docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          /usr/bin/docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "docker.io/${{ vars.DOCKERHUB_USERNAME }}/omnimem-mcp:${{ github.ref_name }}" \
            --tag "docker.io/${{ vars.DOCKERHUB_USERNAME }}/omnimem-mcp:latest" \
            --push \
            mcp_server/

  build-web-ui:
    name: Build web_ui
    runs-on: sqcows
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: /usr/bin/docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Docker Buildx
        run: |
          /usr/bin/docker buildx create --name multiarch --driver docker-container --use || true
          /usr/bin/docker buildx inspect --bootstrap

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            /usr/bin/docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          /usr/bin/docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "docker.io/${{ vars.DOCKERHUB_USERNAME }}/omnimem-web:${{ github.ref_name }}" \
            --tag "docker.io/${{ vars.DOCKERHUB_USERNAME }}/omnimem-web:latest" \
            --file web_ui/Dockerfile \
            --push \
            .

  build-rss-worker:
    name: Build rss_worker
    runs-on: sqcows
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: /usr/bin/docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Docker Buildx
        run: |
          /usr/bin/docker buildx create --name multiarch --driver docker-container --use || true
          /usr/bin/docker buildx inspect --bootstrap

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            /usr/bin/docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          /usr/bin/docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "docker.io/${{ vars.DOCKERHUB_USERNAME }}/omnimem-rss:${{ github.ref_name }}" \
            --tag "docker.io/${{ vars.DOCKERHUB_USERNAME }}/omnimem-rss:latest" \
            --push \
            rss_worker/
