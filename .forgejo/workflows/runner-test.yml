name: Runner Diagnostic

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe the ${{ matrix.arch }} Linux runner
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [linux, "${{ matrix.arch }}"]
    steps:
      - name: Environment probe
        run: |
          uname -a
          id
          grep PRETTY_NAME /etc/os-release
          echo "cpus: $(nproc)"
          free -h | head -2
          df -h / "$HOME" | awk 'NR==1 || !seen[$0]++'
          for tool in docker git node cargo rustup; do
            printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo 'not found')"
          done
          docker version --format 'docker: {{.Server.Version}}' || echo "docker failed"
          du -sh "$HOME/.cache" 2>/dev/null || true
