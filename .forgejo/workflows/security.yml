name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit:
    name: Bandit SAST
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (fail on medium+ severity)
        run: bandit -r mcp_server/ web_ui/ rss_worker/ -ll

  pip-audit:
    name: Dependency Audit (${{ matrix.service }})
    runs-on: codeberg-small
    strategy:
      matrix:
        service:
          - mcp_server
          - web_ui
          - rss_worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement ${{ matrix.service }}/requirements.txt --strict --vulnerability-service osv

  coverage:
    name: Test Coverage
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov genbadge[coverage]
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pydantic python-dotenv ulid-py valkey sentence-transformers

      - name: Run tests with coverage
        working-directory: mcp_server
        run: pytest --cov=memory --cov=tools --cov-report=xml --cov-report=term-missing

      - name: Generate coverage badge
        working-directory: mcp_server
        run: genbadge coverage --local -i coverage.xml -o ../coverage-badge.svg

      - name: Upload badge artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.svg

  gitleaks:
    name: Secret Scan
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          chmod +x gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source=. --exit-code=1 --redact
