name: Security Scans

on:
  push:
    branches: [main]
    tags-ignore:
      - "**"
  pull_request:
    branches: [main]

jobs:
  bandit:
    name: Bandit SAST
    runs-on: sqcows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (fail on medium+ severity)
        run: bandit -r mcp_server/ web_ui/ rss_worker/ -ll

  pip-audit:
    name: Dependency Audit (${{ matrix.service }})
    runs-on: sqcows
    strategy:
      matrix:
        service:
          - mcp_server
          - web_ui
          - rss_worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement ${{ matrix.service }}/requirements.txt --strict --vulnerability-service osv

  coverage:
    name: Test Coverage
    runs-on: sqcows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov genbadge[coverage]
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r mcp_server/requirements.txt -r web_ui/requirements.txt

      - name: Run tests with coverage
        working-directory: mcp_server
        run: pytest --cov=memory --cov=tools --cov-report=xml --cov-report=term-missing

      - name: Generate coverage badge
        working-directory: mcp_server
        run: genbadge coverage --local -i coverage.xml -o ../coverage-badge.svg

      - name: Publish badge to badges branch
        run: |
          cp coverage-badge.svg /tmp/coverage-badge.svg
          rm -f coverage-badge.svg
          git config user.name "Forgejo Actions"
          git config user.email "actions@codeberg.org"
          if git fetch origin badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi
          cp /tmp/coverage-badge.svg coverage-badge.svg
          git add coverage-badge.svg
          git diff --cached --quiet || git commit -m "Update coverage badge"
          git push origin badges

  gitleaks:
    name: Secret Scan
    runs-on: sqcows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          case "$(uname -m)" in
            aarch64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" | tar xz
          chmod +x gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source=. --exit-code=1 --redact
