[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and known false positives"
regexes = [
  # Placeholder tokens in the deployment guides
  '''your-mcp-token''',
  # generic-api-key matches "key" inside "valkey" and then flags an adjacent
  # Python kwarg as the secret (e.g. expand_queries=True in test code)
  '''^expand_queries=''',
]
